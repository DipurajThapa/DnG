name: Goliath Development CI

on:
  push:
    branches:
      - develop/goliath
  pull_request:
    branches:
      - main
    paths:
      - 'apps/goliath/**'
      - 'docs/architecture/**'
      - '.github/workflows/goliath-development-ci.yml'

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate JavaScript syntax
        run: |
          node --check apps/goliath/app.js
          node --check apps/goliath/governance-ui.js
          node --check apps/goliath/pmo-controls-ui.js
          node --check apps/goliath/role-model-ui.js
          node --check apps/goliath/diagnostics-ui.js
          node --check apps/goliath/invitation-ui.js
          node --check apps/goliath/capability-ui.js
          node --check apps/goliath/policy-ui.js
          node --check apps/goliath/runtime-config.js
          node --check apps/goliath/tests/development-contract-check.mjs

      - name: Validate development runtime boundary
        shell: bash
        run: |
          grep -q "environment: 'development'" apps/goliath/runtime-config.js
          grep -q "ep-ancient-night-au3h4qqm" apps/goliath/runtime-config.js
          grep -q 'deploymentEnabled' apps/goliath/vercel.json
          grep -q 'develop/goliath' apps/goliath/vercel.json

      - name: Validate product direction guardrails
        shell: bash
        run: |
          grep -q 'Project Control & Decision Intelligence' apps/goliath/index.html
          grep -q 'governance-ui.js' apps/goliath/index.html
          grep -q 'pmo-controls-ui.js' apps/goliath/index.html
          grep -q 'role-model-ui.js' apps/goliath/index.html
          grep -q 'diagnostics-ui.js' apps/goliath/index.html
          grep -q 'invitation-ui.js' apps/goliath/index.html
          grep -q 'capability-ui.js' apps/goliath/index.html
          grep -q 'policy-ui.js' apps/goliath/index.html
          grep -q 'Commitment + Evidence + Decision Intelligence' docs/architecture/DEVELOPMENT_ENVIRONMENT.md
          grep -q 'Activities become execution evidence' docs/architecture/CURRENT_VS_TARGET_GAP_MATRIX_2026-09-12.md
          grep -q 'No separate status dataset' apps/goliath/app.js
          grep -q 'No actual cost, margin or EAC' apps/goliath/app.js
          grep -q 'Human-confirmed links count' apps/goliath/governance-ui.js
          grep -q 'Risk scoring is human-entered' apps/goliath/governance-ui.js
          grep -q 'Approved baselines are immutable snapshots' apps/goliath/governance-ui.js
          grep -q 'Only evidence-supported measures are calculated' apps/goliath/pmo-controls-ui.js
          grep -q 'Do not estimate a lower number' apps/goliath/pmo-controls-ui.js
          grep -q 'My responsibilities' apps/goliath/role-model-ui.js
          grep -q 'Configuration is not treated as proof' apps/goliath/role-model-ui.js
          grep -q 'does not silently discard ambiguous records' apps/goliath/diagnostics-ui.js
          grep -q 'Step 1 of 2' apps/goliath/invitation-ui.js
          grep -q 'Send invitation by email' apps/goliath/invitation-ui.js
          grep -q 'Copy invitation token' apps/goliath/invitation-ui.js
          grep -q 'Role capability matrix' apps/goliath/capability-ui.js
          grep -q 'Run authorization self-test' apps/goliath/capability-ui.js
          grep -q 'my_capabilities' apps/goliath/policy-ui.js
          grep -q 'data-authority-mode' /dev/null 2>/dev/null || grep -q 'dataset.authorityMode' apps/goliath/policy-ui.js

      - name: Validate migration set is present
        shell: bash
        run: |
          test -f apps/goliath/migrations/20260912_commitment_evidence_foundation.sql
          test -f apps/goliath/migrations/20260912_data_ownership_classification.sql
          test -f apps/goliath/migrations/20260912_decision_dependency_semantics.sql
          test -f apps/goliath/migrations/20260912_mvp_health_foundation.sql
          test -f apps/goliath/migrations/20260912_mvp_read_model.sql
          test -f apps/goliath/migrations/20260912_reporting_projection_foundation.sql
          test -f apps/goliath/migrations/20260912_notification_escalation_foundation.sql
          test -f apps/goliath/migrations/20260912_capacity_planned_cost_foundation.sql
          test -f apps/goliath/migrations/20260912_raid_control_foundation.sql
          test -f apps/goliath/migrations/20260912_baseline_change_control_foundation.sql
          test -f apps/goliath/migrations/20260912_requirements_traceability_foundation.sql
          test -f apps/goliath/migrations/20260912_initial_baseline_approval.sql
          test -f apps/goliath/migrations/20260912_governance_authorization_hardening.sql
          test -f apps/goliath/migrations/20260912_baseline_immutability_hardening.sql
          test -f apps/goliath/migrations/20260912_integration_health_outcome_metrics.sql
          test -f apps/goliath/migrations/20260912_legacy_public_rpc_lockdown.sql
          test -f apps/goliath/migrations/20260912_role_catalog_admin_coverage.sql
          test -f apps/goliath/migrations/20260912_reconciliation_evidence_diagnostics.sql
          test -f apps/goliath/migrations/20260912_acceptance_readiness.sql
          test -f apps/goliath/migrations/20260912_invitation_flow_v2.sql
          test -f apps/goliath/migrations/20260912_role_action_capability_matrix.sql
          test -f apps/goliath/migrations/20260912_role_action_capability_matrix_fix.sql
          test -f apps/goliath/migrations/20260912_role_action_data_action_fix.sql
          test -f apps/goliath/migrations/20260912_authorization_self_test.sql
          test -f apps/goliath/migrations/20260912_capability_enforcement_wrappers.sql
          test -f apps/goliath/migrations/20260912_remaining_action_policy.sql
          test -f apps/goliath/migrations/20260912_remaining_capability_wrappers.sql
          test -f apps/goliath/migrations/20260912_final_mutation_policy.sql
          test -f apps/goliath/dev-seeds/20260912_goliath_dev_role_coverage.sql

      - name: Validate governance surfaces have no silent bypass
        shell: bash
        run: |
          grep -q "submit_initial_baseline" apps/goliath/governance-ui.js
          grep -q "finalize_change_request" apps/goliath/governance-ui.js
          grep -q "convert_raid_trigger_to_issue" apps/goliath/governance-ui.js
          grep -q "link_requirement" apps/goliath/governance-ui.js
          grep -q "trg_pc_baselines_no_update" apps/goliath/migrations/20260912_baseline_immutability_hardening.sql
          grep -q "trg_pc_baselines_no_delete" apps/goliath/migrations/20260912_baseline_immutability_hardening.sql
          grep -q "admin_role_coverage" apps/goliath/role-model-ui.js
          grep -q "acceptance_readiness" apps/goliath/role-model-ui.js
          grep -q "integration_reconciliation_queue" apps/goliath/diagnostics-ui.js
          grep -q "evidence_gap_diagnostics" apps/goliath/diagnostics-ui.js
          grep -q "admin_invitation_targets" apps/goliath/migrations/20260912_invitation_flow_v2.sql
          grep -q "v_reused" apps/goliath/migrations/20260912_invitation_flow_v2.sql
          grep -q "admin_record_identity_invitation_share" apps/goliath/migrations/20260912_invitation_flow_v2.sql
          grep -q "does not close on blur" apps/goliath/invitation-ui.js
          grep -q "role_action_policy" apps/goliath/migrations/20260912_role_action_capability_matrix.sql
          grep -q "conditional" apps/goliath/migrations/20260912_role_action_capability_matrix.sql
          grep -q "data_action" apps/goliath/migrations/20260912_role_action_data_action_fix.sql
          grep -q "run_authorization_self_test" apps/goliath/migrations/20260912_authorization_self_test.sql
          grep -q "admin_authorization_acceptance_summary" apps/goliath/migrations/20260912_authorization_self_test.sql
          grep -q "require_capability" apps/goliath/migrations/20260912_capability_enforcement_wrappers.sql
          grep -q "change','prepare" apps/goliath/migrations/20260912_remaining_action_policy.sql
          grep -q "work','update" apps/goliath/migrations/20260912_remaining_action_policy.sql
          grep -q "notification-recipient" apps/goliath/migrations/20260912_remaining_action_policy.sql
          grep -q "_policy_update_activity" apps/goliath/migrations/20260912_remaining_capability_wrappers.sql
          grep -q "_policy_prepare_change_request" apps/goliath/migrations/20260912_remaining_capability_wrappers.sql
          grep -q "reconcile-exception" apps/goliath/migrations/20260912_final_mutation_policy.sql
          grep -q "admin-effort-sample" apps/goliath/migrations/20260912_final_mutation_policy.sql

      - name: Run integrated development contract checks
        run: node apps/goliath/tests/development-contract-check.mjs
