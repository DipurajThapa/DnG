<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goliath Project Management Tracker</title>
<meta name="description" content="Goliath Project Management Tracker — validated role-aware project control review">
<link rel="icon" type="image/png" href="/goliath-head.png">
<style>html,body,#app{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#f6f7fb}#app{display:block}</style>
</head>
<body>
<iframe id="app" src="/app.html" title="Goliath Project Management Tracker"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d)return;
    d.title='Goliath Project Management Tracker';
    let icon=d.querySelector('link[rel="icon"]');
    if(!icon){icon=d.createElement('link');icon.rel='icon';d.head.appendChild(icon)}
    icon.type='image/png';icon.href='/goliath-head.png';
    const mark=d.querySelector('.brand .mark');
    if(mark){
      mark.textContent='';
      mark.style.background='transparent';
      mark.style.border='0';
      mark.style.overflow='hidden';
      const img=d.createElement('img');
      img.src='/goliath-head.png';img.alt='Goliath';
      img.style.width='44px';img.style.height='44px';img.style.objectFit='cover';img.style.borderRadius='50%';
      mark.appendChild(img);
    }
  }catch(e){console.error('Goliath branding enhancement failed',e)}
});
</script>
</body>
</html>
