<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goliath Project Management Tracker</title>
<link rel="icon" href="/goliath-head.png">
<style>
:root{--bg:#f5f6fa;--panel:#fff;--ink:#182230;--muted:#667085;--line:#e5e7eb;--brand:#2e1d3b;--brand2:#6b4b7c;--good:#0f7a55;--warn:#9a6700;--bad:#b42318;--soft:#f0eaf4}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:var(--ink);background:var(--bg)}button,select,input{font:inherit}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.side{background:#21172a;color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;padding:2px 6px 18px;border-bottom:1px solid #403248}.brand img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#fff}.brand b{display:block;font-size:18px}.brand span{font-size:11px;color:#d2c7d8}.nav{padding-top:13px}.nav button{display:block;width:100%;border:0;background:transparent;color:#ddd2e5;padding:10px 11px;border-radius:8px;text-align:left;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#3c2c47;color:#fff}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;z-index:5}.context{display:flex;gap:8px;align-items:center}.context select{min-width:300px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--good)}.status.bad{color:var(--bad)}.content{padding:24px;max-width:1450px;margin:auto}h1{margin:0 0 4px;font-size:26px}.sub{color:var(--muted);margin:0 0 18px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;background:linear-gradient(90deg,#f0e8f4,#fbf9fc);border:1px solid #e4d9e8;border-radius:12px;padding:14px 16px;margin-bottom:16px}.hero b{font-size:16px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#fff;border:1px solid #decfe5;color:#5e3d70;padding:4px 8px;border-radius:999px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px #1018280a}.card{padding:15px}.card span{font-size:12px;color:var(--muted)}.card strong{display:block;font-size:24px;margin-top:5px}.panel{padding:16px;margin-bottom:16px}.panel h3{margin:0 0 12px;font-size:15px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px}.btn{border:0;border-radius:8px;padding:8px 11px;background:var(--brand2);color:#fff}.btn.ghost{background:#fff;color:var(--brand2);border:1px solid #d8cbe0}table{width:100%;border-collapse:collapse}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fafbfc}.badge{display:inline-block;padding:4px 7px;border-radius:7px;font-size:11px;font-weight:700}.good{background:#ecfdf3;color:var(--good)}.warn{background:#fff7e8;color:var(--warn)}.bad{background:#fff0ef;color:var(--bad)}.muted{color:var(--muted);font-size:12px}.empty{padding:28px;text-align:center;color:var(--muted)}.error{background:#fff0ef;border:1px solid #f0b7b2;color:#8f1d16;padding:12px;border-radius:9px;margin-bottom:15px}.hidden{display:none!important}.loading{opacity:.55;pointer-events:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.top{position:static}.grid{grid-template-columns:repeat(2,1fr)}.context select{min-width:200px}}@media(max-width:580px){.grid{grid-template-columns:1fr}.top{height:auto;padding:12px;align-items:flex-start;gap:10px;flex-direction:column}.context{width:100%}.context select{width:100%;min-width:0}.content{padding:15px}}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="side"><div class="brand"><img src="/goliath-head.png" alt="Goliath"><div><b>Goliath</b><span>Project Management Tracker</span></div></div><nav class="nav" id="nav"></nav></aside>
<main class="main"><header class="top"><div><b id="scopeTitle">Goliath Control</b><div class="status" id="connection">Connecting to API…</div></div><div class="context"><span class="muted">Acting as</span><select id="contextSelect" aria-label="Acting context"></select></div></header><div class="content"><div id="error"></div><div id="view"></div></div></main>
</div>
<script>
const API='https://ep-twilight-unit-au4iuyze.apirest.c-10.us-east-1.aws.neon.tech/edapos/rest/v1';
let contexts=[],workspace=null,current='attention';
const labels={attention:'Attention',projects:'Projects',work:'Work',people:'People & capacity',money:'Money',admin:'Administration'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function badge(v){const s=String(v||'').toLowerCase();const cls=s==='blocked'||s==='critical'?'bad':(s==='in-progress'||s==='active'||s==='done'?'good':'warn');return `<span class="badge ${cls}">${esc(v||'—')}</span>`;}
async function rpc(name,payload={}){const r=await fetch(`${API}/rpc/${name}`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});if(!r.ok){const t=await r.text();throw new Error(`${r.status} ${t.slice(0,280)}`)}return r.json();}
function roleViews(role){if(role==='enterprise-admin')return ['admin','projects'];if(role==='resource-manager')return ['people','projects','money'];if(role==='portfolio-manager')return ['attention','projects','money'];if(role==='sponsor')return ['attention','projects','work','money'];if(role==='team-member'||role==='delivery-lead'||role==='agile-delivery-lead')return ['attention','work','projects'];return ['attention','projects','work','people','money'];}
function renderNav(){const views=roleViews(workspace?.role);if(!views.includes(current))current=views[0];document.getElementById('nav').innerHTML=views.map(v=>`<button data-view="${v}" class="${v===current?'active':''}">${labels[v]}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{current=b.dataset.view;render();});}
function kpi(label,value){return `<div class="card"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;}
function projectTable(){const rows=(workspace.projects||[]).map(p=>`<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.code)} · ${esc(p.lifecycle)}</div></td><td>${esc(p.blockedActivities)}</td><td>${esc(p.overdueActivities)}</td><td>${esc(p.forecastFinish||'—')}</td><td>${p.budget==null?'—':esc(p.currency+' '+Number(p.budget).toLocaleString())}</td></tr>`).join('');return `<div class="panel"><table><thead><tr><th>Project</th><th>Blocked</th><th>Overdue</th><th>Forecast</th><th>Budget</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">No projects available for this context.</td></tr>'}</tbody></table></div>`;}
function workTable(){const rows=(workspace.work||[]).map(w=>`<tr><td><b>${esc(w.title)}</b><div class="muted">${esc(w.projectId)} · ${esc(w.phase)}</div></td><td>${badge(w.status)}</td><td>${esc(w.ownerId||'Unassigned')}</td><td>${esc(w.teamId||'—')}</td><td>${esc(w.forecastFinish||w.baselineFinish||'—')}</td><td>${esc(w.percentComplete??0)}%</td></tr>`).join('');return `<div class="panel"><table><thead><tr><th>Work</th><th>Status</th><th>Owner</th><th>Team</th><th>Forecast</th><th>Progress</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">No work items are visible for this role.</td></tr>'}</tbody></table></div>`;}
function attention(){const work=workspace.work||[],blocked=work.filter(x=>x.status==='blocked'),critical=work.filter(x=>x.priority==='critical');return `<h1>Attention</h1><p class="sub">Role-scoped exceptions calculated from the live API projection.</p><div class="hero"><div><b>${esc(workspace.profile?.title)}</b><div class="muted">${esc(workspace.profile?.purpose)}</div></div><div class="chips"><span class="chip">${esc(workspace.scope?.type)}: ${esc(workspace.scope?.id)}</span><span class="chip">${esc(workspace.displayName)}</span></div></div><div class="grid">${kpi('Visible projects',(workspace.projects||[]).length)}${kpi('Visible work',work.length)}${kpi('Blocked',blocked.length)}${kpi('Critical',critical.length)}</div><div class="panel"><h3>Needs attention</h3>${blocked.concat(critical.filter(x=>!blocked.includes(x))).slice(0,8).map(x=>`<div style="padding:10px 0;border-top:1px solid #eee"><b>${esc(x.title)}</b><div class="muted">${esc(x.projectId)} · ${esc(x.blocker||x.priority)} · ${esc(x.forecastFinish||'')}</div></div>`).join('')||'<div class="empty">No material exceptions visible for this context.</div>'}</div>`;}
function projects(){return `<h1>Projects</h1><p class="sub">Projects resolved from the selected responsibility scope.</p><div class="grid">${kpi('Projects',(workspace.projects||[]).length)}${kpi('Blocked',(workspace.projects||[]).reduce((n,p)=>n+(p.blockedActivities||0),0))}${kpi('Overdue',(workspace.projects||[]).reduce((n,p)=>n+(p.overdueActivities||0),0))}${kpi('Unowned',(workspace.projects||[]).reduce((n,p)=>n+(p.unownedActivities||0),0))}</div>${projectTable()}`;}
function work(){return `<h1>Work</h1><p class="sub">This list changes at the API layer when the acting context changes.</p><div class="grid">${kpi('Visible items',(workspace.work||[]).length)}${kpi('In progress',(workspace.work||[]).filter(x=>x.status==='in-progress').length)}${kpi('Blocked',(workspace.work||[]).filter(x=>x.status==='blocked').length)}${kpi('Milestones',(workspace.work||[]).filter(x=>x.milestone==1||x.milestone===true).length)}</div>${workTable()}`;}
function people(){if(workspace.role==='resource-manager'){const c=workspace.capacity||{resources:[],demands:[]};return `<h1>People & capacity</h1><p class="sub">Functional capacity and demand returned from the database for the Resource Manager context.</p><div class="grid">${kpi('Resources',c.resources.length)}${kpi('Open demands',c.demands.filter(d=>d.state==='open').length)}${kpi('Required hours',c.demands.reduce((n,d)=>n+Number(d.requiredHours||0),0))}${kpi('Scope',workspace.scope?.id||'—')}</div><div class="panel"><h3>Resources</h3><table><thead><tr><th>Resource</th><th>Unit</th><th>Skills</th><th>Contract hours</th></tr></thead><tbody>${c.resources.map(r=>`<tr><td><b>${esc(r.displayName)}</b></td><td>${esc(r.orgUnitId)}</td><td>${esc(typeof r.skills==='string'?r.skills:JSON.stringify(r.skills))}</td><td>${esc(r.weeklyContractHours)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No resources in scope.</td></tr>'}</tbody></table></div>`;}return `<h1>People & capacity</h1><p class="sub">Project-team visibility is represented by the role-scoped work and project projections. Switch to Resource Manager for functional capacity.</p>${projectTable()}`;}
function money(){const f=workspace.finance||[];return `<h1>Money</h1><p class="sub">Budget and forecast facts returned from PostgreSQL for projects visible to this context.</p><div class="grid">${kpi('Budget',f.reduce((n,x)=>n+Number(x.budget||0),0).toLocaleString())}${kpi('EAC',f.reduce((n,x)=>n+Number(x.eac||0),0).toLocaleString())}${kpi('ETC',f.reduce((n,x)=>n+Number(x.etcAmount||0),0).toLocaleString())}${kpi('Projects',f.length)}</div><div class="panel"><table><thead><tr><th>Project</th><th>Budget</th><th>EAC</th><th>ETC</th><th>Contingency</th></tr></thead><tbody>${f.map(x=>`<tr><td><b>${esc(x.projectName)}</b></td><td>${esc(x.currency)} ${Number(x.budget||0).toLocaleString()}</td><td>${esc(x.currency)} ${Number(x.eac||0).toLocaleString()}</td><td>${esc(x.currency)} ${Number(x.etcAmount||0).toLocaleString()}</td><td>${esc(x.currency)} ${Number(x.contingencyAmount||0).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No financial projection in scope.</td></tr>'}</tbody></table></div>`;}
function admin(){const a=workspace.administration;if(!a)return `<h1>Administration</h1><div class="error">Enterprise Admin context is required.</div>`;const rows=(a.users||[]).map(u=>`<tr><td><b>${esc(u.displayName)}</b><div class="muted">${esc(u.userId)}</div></td><td>${esc((u.roles||[]).join(', '))}</td><td>${esc((u.teams||[]).filter(Boolean).join(', ')||'—')}</td></tr>`).join('');return `<h1>Administration</h1><p class="sub">Organisation directory derived from responsibility assignments plus project rosters.</p><div class="grid">${kpi('Known users',a.knownUsers)}${kpi('Responsibility contexts',a.responsibilityContexts)}${kpi('Projects',(workspace.projects||[]).length)}${kpi('Source','PostgreSQL')}</div><div class="panel"><div class="toolbar"><input id="userSearch" placeholder="Search users or roles"></div><table><thead><tr><th>User</th><th>Roles</th><th>Teams</th></tr></thead><tbody id="userRows">${rows}</tbody></table></div>`;}
function render(){renderNav();document.getElementById('scopeTitle').textContent=workspace?`${workspace.profile.title} · ${workspace.scope.type} ${workspace.scope.id}`:'Goliath Control';const fn={attention,projects,work,people,money,admin}[current]||attention;document.getElementById('view').innerHTML=workspace?fn():'<div class="empty">Select a context.</div>';const q=document.getElementById('userSearch');if(q)q.oninput=()=>{const v=q.value.toLowerCase();document.querySelectorAll('#userRows tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?'':'none');};}
async function loadWorkspace(id){document.getElementById('app').classList.add('loading');document.getElementById('error').innerHTML='';try{const rows=await rpc('workspace',{p_assignment_id:id});workspace=Array.isArray(rows)?rows[0]:rows;document.getElementById('connection').textContent='Live · UI → Neon Data API → PostgreSQL';document.getElementById('connection').className='status ok';render();}catch(e){document.getElementById('connection').textContent='Connection error';document.getElementById('connection').className='status bad';document.getElementById('error').innerHTML=`<div class="error"><b>API connection failed.</b><br>${esc(e.message)}</div>`;}finally{document.getElementById('app').classList.remove('loading');}}
async function init(){try{const rows=await rpc('list_contexts');contexts=rows;const sel=document.getElementById('contextSelect');sel.innerHTML=contexts.map(c=>`<option value="${esc(c.assignment_id)}">${esc(c.display_name)} · ${esc(c.role)} · ${esc(c.scope_label)}</option>`).join('');sel.value=contexts.find(c=>c.assignment_id==='PM-A')?'PM-A':contexts[0]?.assignment_id||'';sel.onchange=()=>loadWorkspace(sel.value);if(sel.value)await loadWorkspace(sel.value);}catch(e){document.getElementById('connection').textContent='API unavailable';document.getElementById('connection').className='status bad';document.getElementById('error').innerHTML=`<div class="error"><b>Could not load acting contexts.</b><br>${esc(e.message)}</div>`;}}
init();
</script>
</body></html>
